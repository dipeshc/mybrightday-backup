name: Daily Backup

on:
  # Runs at 02:00 UTC (7 PM US/Pacific).
  schedule:
    - cron: '0 2 * * *'
  # Also allows manual triggering. The `date` input optionally overrides the
  # date range for a single run; leave it blank to fall back to the repository
  # `DATE` variable, or to the hardcoded default if that is also unset.
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date or date range (YYYY-MM-DD, -N, +N, or -N:+N). Leave blank to use the repository DATE variable, or "-7:+3" if unset.'
        required: false
        type: string

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the latest release for Linux AMD64
          gh release download --repo ${{ github.repository }} --pattern "*linux-amd64.tar.gz"
          tar -xzf mbdb-linux-amd64.tar.gz
          chmod +x mbdb

      - name: Run MyBrightDay Backup
        env:
          # Inject repository secrets into environment variables
          MYBRIGHTDAY_EMAIL: ${{ secrets.MYBRIGHTDAY_EMAIL }}
          MYBRIGHTDAY_PASSWORD: ${{ secrets.MYBRIGHTDAY_PASSWORD }}
          GOOGLE_PHOTOS_REFRESH_TOKEN: ${{ secrets.GOOGLE_PHOTOS_REFRESH_TOKEN }}
        run: |
          ./mbdb \
            --date "${{ inputs.date || vars.DATE || '-7:+3' }}" \
            --local.enabled=false \
            --googlephotos.enabled=true \
            --logging.level=DEBUG \
            --logging.format=text-full
