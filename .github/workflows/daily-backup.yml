name: Daily Backup

# How this job logs in
# --------------------
# mbdb keeps two logins under its config directory: a MyBrightDay session
# (valid for about a year) and a Google Photos refresh token. Both are made
# through your browser, once. This job keeps that directory between runs in
# the Actions cache, encrypted with the MBD_STATE_KEY secret. Nothing else in
# the repository ever holds them.
#
# First-time setup, and renewal when a login expires, takes two manual runs:
# the first writes the login links to the job summary, the second is given the
# addresses the browser landed on via the callback inputs. See the README.
#
# Only run this workflow on the default branch: cache writes are scoped to the
# branch that made them, so a run elsewhere would store the logins where the
# scheduled runs cannot find them.

on:
  # Runs at 02:00 UTC (7 PM US/Pacific).
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date or date range (YYYY-MM-DD, -N, +N, or -N:+N). Leave blank to use the repository DATE variable, or "-7:+3" if unset.'
        required: false
        type: string
      mybrightday_callback_url:
        description: 'Setup or renewal only: the address you landed on after logging in to MyBrightDay (starts with http://localhost:4200/okta/callback?code=).'
        required: false
        type: string
      google_callback_url:
        description: 'Setup or renewal only: the address you landed on after signing in to Google (starts with http://localhost:4201/google/callback?code=).'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-backup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backup:
    name: Backup
    runs-on: ubuntu-latest
    env:
      STATE_FILE: mbd-state.enc
      PENDING_FILE: mbd-pending.enc
      STATE_DIR: config
    steps:
      - name: Refuse to run off the default branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::Run this workflow on the default branch only (see the comment at the top of the workflow)."
          exit 1

      - name: Check encryption key
        env:
          MBD_STATE_KEY: ${{ secrets.MBD_STATE_KEY }}
        run: |
          # The encrypted state can be read by anyone able to run a pull-request
          # workflow in this repository, so the key must be random, not a
          # passphrase. Accept exactly what `openssl rand -hex 32` produces.
          if [[ "$MBD_STATE_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            exit 0
          fi
          {
            if [ -z "$MBD_STATE_KEY" ]; then
              echo '## Missing secret: MBD_STATE_KEY'
            else
              echo '## MBD_STATE_KEY is not a valid key'
            fi
            echo
            echo 'This workflow keeps your logins encrypted between runs and needs a random key to do it.'
            echo 'Generate one with `openssl rand -hex 32` (64 hex characters; a passphrase you made up is not safe here)'
            echo 'and add it as a repository secret named `MBD_STATE_KEY` (Settings > Secrets and variables > Actions),'
            echo 'then run the workflow again.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::MBD_STATE_KEY is missing or not a 64-character hex key. See the job summary."
          exit 1

      - name: Download Corresponding Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          # Fetch the release tag that ends with the short SHA
          TAG=$(gh release list --repo ${{ github.repository }} --limit 50 --json tagName -q ".[].tagName" | grep -- "-${SHORT_SHA}$" | head -n 1 || true)

          if [ -z "$TAG" ]; then
            echo "Could not find a release for commit $SHORT_SHA. Falling back to latest release."
            gh release download --repo ${{ github.repository }} --pattern "*linux-amd64.tar.gz"
          else
            echo "Downloading release $TAG"
            gh release download "$TAG" --repo ${{ github.repository }} --pattern "*linux-amd64.tar.gz"
          fi

          tar -xzf mbdb-linux-amd64.tar.gz
          chmod +x mbdb

      # Cache entries are immutable, so every run saves under its own key and
      # the next run restores the newest one by prefix. Logins and in-progress
      # (pending) logins live in separate entries: the logins entry is only
      # ever written when a login exists, so a run that merely issued links can
      # never supersede a good one.
      - name: Restore logins
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: mbd-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mbd-state-

      - name: Restore pending logins
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PENDING_FILE }}
          key: mbd-pending-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mbd-pending-

      - name: Decrypt logins
        id: decrypt
        env:
          MBD_STATE_KEY: ${{ secrets.MBD_STATE_KEY }}
        run: |
          mkdir -p "$STATE_DIR"
          if [ -f "$STATE_FILE" ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:MBD_STATE_KEY -in "$STATE_FILE" 2>/dev/null \
                 | tar -xzf - -C "$STATE_DIR"; then
              echo "Restored stored logins."
            else
              rm -rf "${STATE_DIR:?}"/*
              echo "Stored logins could not be decrypted (was MBD_STATE_KEY changed?). Starting fresh."
              echo '> Stored logins could not be decrypted, so this run starts fresh. If you changed `MBD_STATE_KEY`, that is expected.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No stored logins yet."
          fi
          if [ -f "$PENDING_FILE" ]; then
            # Pending logins are only useful for ten minutes; a failure here just
            # means a fresh link will be issued.
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:MBD_STATE_KEY -in "$PENDING_FILE" 2>/dev/null \
              | tar -xzf - -C "$STATE_DIR" 2>/dev/null || true
          fi
          rm -f "$STATE_FILE" "$PENDING_FILE"
          # The logins are not registered secrets, so tell the runner to mask
          # them in case anything ever echoes them.
          for f in "$STATE_DIR/mybrightday/session" "$STATE_DIR/google_photos/refresh_token"; do
            if [ -s "$f" ]; then
              echo "::add-mask::$(cat "$f")"
            fi
          done

      - name: Run MyBrightDay Backup
        id: run
        env:
          # Optional, for setups made before logins were stored by this
          # workflow: a Google token kept as a secret is used until a login is
          # stored, after which the stored login wins (see below).
          GOOGLE_PHOTOS_REFRESH_TOKEN: ${{ secrets.GOOGLE_PHOTOS_REFRESH_TOKEN }}
          DATE_ARG: ${{ inputs.date || vars.DATE || '-7:+3' }}
          MBD_CALLBACK: ${{ inputs.mybrightday_callback_url }}
          GOOGLE_CALLBACK: ${{ inputs.google_callback_url }}
        run: |
          # A login stored by this workflow wins over the legacy secret, so a
          # dead secret cannot keep overriding a fresh login.
          if [ -s "$STATE_DIR/google_photos/refresh_token" ]; then
            unset GOOGLE_PHOTOS_REFRESH_TOKEN
          fi
          args=()
          if [ -n "$MBD_CALLBACK" ]; then
            args+=(--callback-url "$MBD_CALLBACK")
          fi
          if [ -n "$GOOGLE_CALLBACK" ]; then
            args+=(--callback-url "$GOOGLE_CALLBACK")
          fi

          set +e
          ./mbdb "${args[@]}" \
            --date "$DATE_ARG" \
            --local.enabled=false \
            --googlephotos.enabled=true \
            --logging.level=INFO \
            --logging.format=text-full 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          set -e

          for f in "$STATE_DIR/mybrightday/session" "$STATE_DIR/google_photos/refresh_token"; do
            if [ -s "$f" ]; then
              echo "::add-mask::$(cat "$f")"
            fi
          done

          if grep -q "session expires soon" run.log; then
            {
              echo '> **Your MyBrightDay login expires soon.** Run this workflow by hand before then and follow the login steps it shows, so the backups keep running. Details are in the log.'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$rc" -eq 3 ]; then
            mbd_url=$(grep -m1 '^login-url mybrightday ' run.log | cut -d' ' -f3- || true)
            google_url=$(grep -m1 '^login-url google_photos ' run.log | cut -d' ' -f3- || true)
            {
              echo '## Log in to connect your accounts'
              echo
              echo 'This run stopped before backing anything up because a login is needed.'
              echo 'A few steps, about a minute, and you have ten minutes before the links expire.'
              echo
              echo '1. Open each link below and sign in. After each one you will land on a page that says'
              echo '   "This site can'"'"'t be reached". That is expected: copy the whole address from the address bar.'
              echo
              if [ -n "$mbd_url" ]; then
                echo "   - MyBrightDay (log in with your MyBrightDay email and password): $mbd_url"
                echo '     The address you land on starts with `http://localhost:4200/okta/callback?code=`'
              fi
              if [ -n "$google_url" ]; then
                echo "   - Google Photos (choose the Google account to back up to): $google_url"
                echo '     The address you land on starts with `http://localhost:4201/google/callback?code=`'
                echo '     Google may warn that the app is unverified; choose Advanced, then continue.'
              fi
              echo
              echo '2. Come back to Actions, choose "Daily Backup", click "Run workflow", paste each address'
              echo '   into its box (`mybrightday_callback_url`, `google_callback_url`), and run it.'
              echo
              echo 'Only paste addresses you landed on yourself, after signing in with your own accounts.'
              echo 'That run saves the logins and does the backup. You will not need to do this again until a login'
              echo 'expires (about a year for MyBrightDay), when this same message will come back.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "needs_login=true" >> "$GITHUB_OUTPUT"
            echo "Login needed. See the job summary."
            exit 0
          fi
          echo "needs_login=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Always runs after a successful decrypt, even if the backup failed, so a
      # login completed this run is kept. It never runs when decrypt did not
      # complete, so an earlier failure cannot replace the newest good cache
      # entry. The logins entry is written only when at least one login exists.
      - name: Encrypt logins
        id: encrypt
        if: ${{ always() && steps.decrypt.outcome == 'success' }}
        env:
          MBD_STATE_KEY: ${{ secrets.MBD_STATE_KEY }}
        run: |
          [ -d "$STATE_DIR" ] || exit 0
          if [ -s "$STATE_DIR/mybrightday/session" ] || [ -s "$STATE_DIR/google_photos/refresh_token" ]; then
            tar -C "$STATE_DIR" --exclude='pending_login' -czf - . \
              | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:MBD_STATE_KEY -out "$STATE_FILE"
            echo "save_state=true" >> "$GITHUB_OUTPUT"
          else
            echo "No logins to save."
          fi
          # Always write a pending entry, empty when no login is pending, so a
          # consumed login does not keep being restored from an older entry.
          (cd "$STATE_DIR" && find . -type f -name pending_login -print0 | tar -czf - --null -T -) \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:MBD_STATE_KEY -out "$PENDING_FILE"
          echo "save_pending=true" >> "$GITHUB_OUTPUT"
          rm -rf "${STATE_DIR:?}"/*

      - name: Save logins
        id: save
        if: ${{ always() && steps.encrypt.outputs.save_state == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: mbd-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save pending logins
        id: save_pending
        if: ${{ always() && steps.encrypt.outputs.save_pending == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PENDING_FILE }}
          key: mbd-pending-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail if login is needed
        if: ${{ always() && steps.run.outputs.needs_login == 'true' }}
        run: |
          echo "::error::Login needed. Open the job summary and follow the steps."
          exit 1
