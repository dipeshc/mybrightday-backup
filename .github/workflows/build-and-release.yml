name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Generate version
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "value=$(date +'%Y-%m-%d')-${{ github.run_number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

      - name: Report coverage
        run: |
          {
            echo '### Test coverage'
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            artifact: mbdb-darwin-arm64.tar.gz
          - goos: linux
            goarch: amd64
            artifact: mbdb-linux-amd64.tar.gz
          - goos: windows
            goarch: amd64
            artifact: mbdb-windows-amd64.zip

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p build dist
          BINARY=mbdb
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=mbdb.exe
          fi
          go build -ldflags "-X github.com/dipeshc/mybrightday-backup/internal/app.Version=${VERSION}" \
            -o build/${BINARY} ./cmd/mbdb
          if [[ "${{ matrix.artifact }}" == *.zip ]]; then
            cd build && zip ../dist/${{ matrix.artifact }} ${BINARY}
          else
            tar -czf dist/${{ matrix.artifact }} -C build ${BINARY}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          files: artifacts/*
